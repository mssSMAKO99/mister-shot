name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('MisterShot.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Publish (NativeAOT, win-x64)
        run: dotnet publish MisterShot.csproj -c Release -r win-x64 -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MisterShot-win-x64
          path: publish/MisterShot.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/MisterShot.exe
          generate_release_notes: true

  installer:
    name: Publish installer to pages repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push install script to overcumatosis.github.io
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_REPO_TOKEN }}
        run: |
          set -e
          git clone "https://x-access-token:${PAGES_TOKEN}@github.com/msssmaovercumatosisko99/overcumatosis.github.io.git" pages
          cp install.ps1 pages/mshot
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mshot
          if git diff --cached --quiet; then
            echo "Installer unchanged, nothing to push."
          else
            git commit -m "chore: update mshot installer"
            git push
          fi
